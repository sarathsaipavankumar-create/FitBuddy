# ===================================================================
# FitBuddy Spring Boot Configuration
# ===================================================================
spring.application.name=FitBuddy-Backend
server.port=8080

# Application Metadata
app.name=FitBuddy Backend API
app.version=1.0.0
app.frontend.origin=http://localhost:8000

# ===================================================================
# Database Configuration (MySQL)
#
# Credentials are read from environment variables or untracked local
# configuration (application-local.properties).
# NEVER hardcode or commit database passwords into source control.
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fitbuddy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# DataSource AutoConfiguration
#
# For the baseline health-check endpoint (Step 1), DataSourceAutoConfiguration
# is excluded by default so the application starts cleanly without failing
# if MySQL credentials have not yet been provided.
# When database credentials are provided by setting SPRING_DATASOURCE_PASSWORD,
# set SPRING_DATASOURCE_EXCLUDE=none to activate the JPA DataSource.
# ===================================================================
spring.autoconfigure.exclude=${SPRING_DATASOURCE_EXCLUDE:org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration}
